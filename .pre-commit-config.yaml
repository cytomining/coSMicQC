# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  python: python3.11
# globally exclude manuscript sources from all hooks (see docs/manuscripts)
exclude: ^docs/manuscripts/
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
        exclude: |
          (?x)^(
              .*\.svg
          )$
    -   id: check-yaml
    -   id: detect-private-key
-   repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.11.19"
    hooks:
    -   id: uv-lock
-   repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.25.1"
    hooks:
    -   id: pyproject-fmt
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
    -   id: codespell
        exclude: |
          (?x)^(
              .*\.lock |
              .*\.json |
              .*\.ipynb |
              .*\.cppipe
          )$
-   repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
    -   id: mdformat
        additional_dependencies:
        -   mdformat-gfm
        exclude: ^README\.md$  # README is managed by gh-md-toc
-   repo: https://github.com/citation-file-format/cffconvert
    rev: b6045d78aac9e02b039703b030588d54d53262ac
    hooks:
    -   id: validate-cff
-   repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
    -   id: yamllint
        exclude: pre-commit-config.yaml
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
    -   id: actionlint
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.21"
    hooks:
    -   id: ruff-format
    -   id: ruff-check
-   repo: https://github.com/jendrikseipp/vulture
    rev: 'v2.16'
    hooks:
    -   id: vulture
-   repo: local
    hooks:
    -   id: readme-toc
        name: Update README TOC (github-markdown-toc)
        language: system
        entry: scripts/update_readme_toc.sh
        pass_filenames: false
        files: ^README\.md$
-   repo: https://github.com/software-gardening/almanack
    rev: v0.1.16
    hooks:
    -   id: almanack-check
        args: [--exclude_paths=docs]
-   repo: local
    hooks:
    -   id: code-cov-gen
        name: Generate code coverage
        language: system
        entry: uv run coverage run -m pytest
        pass_filenames: false
        always_run: true
-   repo: https://github.com/Weird-Sheep-Labs/coverage-pre-commit
    rev: 0.1.1
    hooks:
    -   id: coverage-xml
    -   id: coverage-badge
        args: ["-o", "media/coverage-badge.svg"]
        additional_dependencies:
        -   setuptools<81

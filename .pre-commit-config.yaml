# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  python: python3.11
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
        exclude: |
          (?x)^(
              .*\.svg
          )$
    -   id: check-yaml
    -   id: detect-private-key
-   repo: https://github.com/python-poetry/poetry
    rev: "2.3.2"
    hooks:
    -   id: poetry-check
-   repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.12.1"
    hooks:
    -   id: pyproject-fmt
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
    -   id: codespell
        exclude: |
          (?x)^(
              .*\.lock |
              .*\.json |
              .*\.ipynb |
              .*\.cppipe |
              .*cosmicqc_paper_v1/.*   # skip everything inside this folder
          )$
-   repo: https://github.com/executablebooks/mdformat
    rev: 0.7.18
    hooks:
    -   id: mdformat
        additional_dependencies:
        -   mdformat-gfm
        exclude: ^README\.md$  # README is managed by gh-md-toc
-   repo: https://github.com/citation-file-format/cffconvert
    rev: b6045d78aac9e02b039703b030588d54d53262ac
    hooks:
    -   id: validate-cff
-   repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
    -   id: yamllint
        exclude: pre-commit-config.yaml
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
    -   id: actionlint
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.1"
    hooks:
    -   id: ruff-format
    -   id: ruff-check
-   repo: https://github.com/jendrikseipp/vulture
    rev: 'v2.14'
    hooks:
    -   id: vulture
-   repo: local
    hooks:
    -   id: readme-toc
        name: Update README TOC (github-markdown-toc)
        language: system
        entry: scripts/update_readme_toc.sh
        pass_filenames: false
        files: ^README\.md$
-   repo: https://github.com/software-gardening/almanack
    rev: v0.1.15
    hooks:
    -   id: almanack-check
        args: [--exclude_paths=docs]
-   repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: v0.6.0
    hooks:
    -   id: pre-commit-update
        args: ["--keep", "mdformat", "--keep", "pre-commit-update", "--keep", "cffconvert",
          "--keep", "pyproject-fmt"]
-   repo: local
    hooks:
    -   id: code-cov-gen
        name: Generate code coverage
        language: system
        entry: poetry run coverage run -m pytest
        pass_filenames: false
        always_run: true
-   repo: https://github.com/Weird-Sheep-Labs/coverage-pre-commit
    rev: 0.1.1
    hooks:
    -   id: coverage-xml
    -   id: coverage-badge
        args: ["-o", "media/coverage-badge.svg"]

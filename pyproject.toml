[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77", "setuptools-scm>=8" ]

[project]
name = "cosmicqc"
description = "coSMicQC is a software tool for single-cell quality control of morphology datasets."
readme = "README.md"
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
authors = [
  { name = "Jenna Tomkinson" },
  { name = "Dave Bunten" },
  { name = "Gregory P. Way" },
]
requires-python = ">=3.10,<3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  # used for assisting single-cell profile and image analysis
  "cytodataframe>=0.0.25; python_version<'3.11'",
  "cytodataframe>=0.3,<0.4; python_version>='3.11'",
  # used for CLI generation
  "fire>=0.6,<0.8",
  # sub-dependency which required lock for numpy installation with py313
  "llvmlite==0.48",
  "matplotlib>=3.10.3,<4",
  # used for data management
  "pandas>=2.2.2,<3",
  # used for data ingest and export
  "pyarrow>=16,<21; python_version<'3.11'",
  # pyarrow 21.x is excluded for Python >=3.11 because cytodataframe>=0.3.0
  # requires ome-arrow, which currently resolves to pyarrow >=22.
  "pyarrow>=22,<23; python_version>='3.11'",
  # used for reading yaml configuration files
  "pyyaml>=6.0.1,<7",
  # used for calculations
  "scipy>=1.13,<2",
  "seaborn>=0.13.2,<0.14",
  # used for rendering tabular summaries in contamination detection output
  "tabulate>=0.9,<1",
]
scripts.cosmicqc = "cosmicqc.cli:cli_analyze"

[dependency-groups]
dev = [
  # used for example notebook formatting
  "black>=24.4.2,<27",
  "copairs>=0.5.1,<0.6",
  # added to generate test coverage reports
  "coverage>=7.6,<8",
  # added for preparing data for cosmicqc in examples
  "cytotable>=0.0.10,<1.2.4",
  # added to avoid warnings from datashader implementation
  "dask[dataframe]>=2024.8,<2027",
  # used for visualization options with hvplot
  "datashader>=0.16.3,<0.20",
  "hdbscan>=0.8.40,<0.9",
  # used for report html export to image for tests
  "html2image>=2.0.4.3,<3",
  # used for visualizing large plot data
  "hvplot>=0.10,<0.13",
  # added for compatibility in notebooks with umap-learn dependency tqdm
  "ipywidgets>=8.1.5,<9",
  # used for example notebook formatting
  "isort>=5.13.2,<9",
  # used for example notebook work
  "jupyterlab>=4.2.3,<5",
  # used for example notebook formatting
  "jupyterlab-code-formatter>=2.2.1,<4",
  # used for example notebook formatting
  "jupytext>=1.16.2,<2",
  "papermill>=2.6,<3",
  "plotnine<=0.15.7",
  # for standardizing various dev tasks
  "poethepoet>=0.27,<0.49",
  "pre-commit>=3,<5",
  "pycomplexheatmap>=1.8.1,<2",
  # added for demonstrating results with cosmicqc
  "pycytominer>=1.1,<2",
  # provides testing capabilities for project
  "pytest>=8.2,<10",
  # used by pandas for extracting metadata and platemap data from S3 through pandas
  "s3fs>=2024.9,<2027",
  # used for rendering plots as images within example notebooks
  "selenium>=4.24,<5",
  # used for test data generation
  "sqlalchemy>=1.3.6,<3",
  # added for demonstrating results after using cosmicqc
  "umap-learn>=0.5.6,<0.6",
]
docs = [
  # used for gathering version data for docsite
  "dunamai>=1.22,<2",
  # used for rendering notebooks through myst parser
  "myst-nb>=1.1.1,<2",
  # used for rendering markdown through sphinx
  "myst-parser>=3,<5",
  # used for rendering docs into docsite
  "sphinx>=7,<9",
  # used for extension sphinx-multiversion and to fix git-based challenges with
  # default branch handling (see [tool.uv.sources] for the pinned git revision)
  "sphinx-multiversion",
  # used for theming the docsite
  "sphinx-wagtail-theme>=6.3,<7",
]

[tool.setuptools]
packages.find.where = [ "src" ]
package-data.cosmicqc = [ "**/*.yml" ]

# set dynamic versioning capabilities for project based on git
[tool.setuptools_scm]
root = "."

[tool.uv]
# pinned fork of sphinx-multiversion to fix git-based challenges with default
# branch handling in the upstream project.
sources.sphinx-multiversion = { git = "https://github.com/J-RN/sphinx-multiversion", rev = "a77f0c862dace3a62c18fc866da60ef7dde3873d" }

[tool.ruff]
target-version = "py310"
line-length = 88
fix = true
lint.select = [
  # flake8-builtins
  "A",
  # flake8-annotations
  "ANN",
  # flake8-comprehensions
  "C4",
  # mccabe
  "C90",
  # pycodestyle
  "E",
  # pyflakes
  "F",
  # isort
  "I",
  # pylint
  "PL",
  # ruff
  "RUF",
  # flake8-simplify
  "SIM",
  "W",
]
# Ignore `E402` and `F401` (unused imports) in all `__init__.py` files
lint.per-file-ignores."__init__.py" = [ "E402", "F401" ]
lint.per-file-ignores."docs/" = [ "E402", "F401" ]
# ignore long line and func def warnings with notebooks
lint.per-file-ignores."docs/src/examples/*.ipynb" = [ "E501", "E703", "F821", "PLR0913" ]
lint.per-file-ignores."docs/src/examples/*.py" = [ "E501", "E703", "PLR0913" ]
lint.per-file-ignores."tests/*" = [ "ANN201", "ANN202", "PLR0913", "PLR2004" ]

[tool.isort]
profile = "black"

[tool.vulture]
paths = [ "src/cosmicqc", "tests" ]
min_confidence = 90

[tool.bandit]
exclude_dirs = [ "tests" ]

[tool.pytest]
ini_options.markers = [
  "generate_report_image: tests which involve the creation of report images.",
]

[tool.coverage]
# settings to avoid errors with cv2 and coverage
# see here for more: https://github.com/nedbat/coveragepy/issues/1653
run.omit = [
  "config-3.py",
  "config.py",
]

[tool.jupytext]
formats = "ipynb,py:light"

[tool.poe]
# note: quarto commands below expect quarto installed on the local system.
# see here for more information: https://quarto.org/docs/download/
tasks.poster-preview.shell = """
quarto preview \
  docs/presentations/2024-09-18-SBI2-Conference/poster.qmd
"""
tasks.poster-render.shell = """
  quarto render \
  docs/presentations/2024-09-18-SBI2-Conference/poster.qmd
  mkdir -p docs/src/media
  mv docs/presentations/2024-09-18-SBI2-Conference/sbi2-2024-cosmicqc-poster.pdf \
  docs/src/media
"""

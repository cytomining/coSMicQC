[build-system]
build-backend = "poetry_dynamic_versioning.backend"
requires = [ "poetry-core>=1", "poetry-dynamic-versioning>=1,<2" ]

[tool.poetry]
name = "coSMicQC"
version = "0.0.0"
description = "coSMicQC is a software tool for single-cell quality control of morphology datasets."
license = "BSD-3-Clause"
authors = [ "Way Science Community" ]
readme = "README.md"
packages = [ { include = "cosmicqc", from = "src" } ]
dependencies.python = ">=3.10,<3.14"
# used for assisting single-cell profile and image analysis
dependencies.cytodataframe = [
  { version = ">=0.0.25", python = "<3.11" },
  { version = ">=0.3.0,<0.4", python = ">=3.11" },
]
# used for CLI generation
dependencies.fire = ">=0.6,<0.8"
# sub-dependency which required lock for numpy installation with py313
dependencies.llvmlite = "0.48.0"
dependencies.matplotlib = "^3.10.3"
dependencies.pandas = [
  { version = "<2.2.2", python = "<3.9" },
  { version = "^2.2.2", python = ">=3.9" },
]  # used for data management
# used for data ingest and export
dependencies.pyarrow = [
  { version = ">=16,<21", python = "<3.11" },
  # pyarrow 21.x is excluded for Python >=3.11 because cytodataframe>=0.3.0
  # requires ome-arrow, which currently resolves to pyarrow >=22.
  { version = ">=22,<23", python = ">=3.11" },
]
# used for reading yaml configuration files
dependencies.pyyaml = "^6.0.1"
dependencies.scipy = [
  { version = "<1.13.0", python = "<3.9" },
  { version = "^1.13.0", python = ">=3.9" },
]  # used for calculations
dependencies.seaborn = "^0.13.2"
# used for rendering tabular summaries in contamination detection output
dependencies.tabulate = ">=0.9,<1"
# used for example notebook formatting
group.dev.dependencies.black = ">=24.4.2,<27.0.0"
# used to avoid dependency resolution issues during installs
group.dev.dependencies.botocore = ">=1.31.16,<1.31.65 || >=1.32.4,<1.34.35 || >=1.34.41,<1.34.163 || >=1.35.0,<1.35.8"
group.dev.dependencies.copairs = "^0.5.1"
# added to generate test coverage reports
group.dev.dependencies.coverage = "^7.6.0"
# added for preparing data for cosmicqc in examples
group.dev.dependencies.cytotable = ">=0.0.10,<1.2.4"
# added to avoid warnings from datashader implementation
group.dev.dependencies.dask = { version = ">=2024.8,<2027.0", extras = [ "dataframe" ] }
# used for visualization options with hvplot
group.dev.dependencies.datashader = ">=0.16.3,<0.20.0"
group.dev.dependencies.hdbscan = "^0.8.40"
# used for report html export to image for tests
group.dev.dependencies.html2image = "^2.0.4.3"
# used for visualizing large plot data
group.dev.dependencies.hvplot = ">=0.10,<0.13"
# added for compatibility in notebooks with umap-learn dependency tqdm
group.dev.dependencies.ipywidgets = "^8.1.5"
# used for example notebook formatting
group.dev.dependencies.isort = ">=5.13.2,<9.0.0"
# used for example notebook work
group.dev.dependencies.jupyterlab = "^4.2.3"
# used for example notebook formatting
group.dev.dependencies.jupyterlab-code-formatter = ">=2.2.1,<4.0.0"
# used for example notebook formatting
group.dev.dependencies.jupytext = "^1.16.2"
group.dev.dependencies.papermill = "^2.6.0"
group.dev.dependencies.plotnine = "<=0.15.7"
# for standardizing various dev tasks
group.dev.dependencies.poethepoet = ">=0.27,<0.49"
group.dev.dependencies.pre-commit = ">=3,<5"
group.dev.dependencies.pycomplexheatmap = "^1.8.1"
# added for demonstrating results with cosmicqc
group.dev.dependencies.pycytominer = "^1.1.0"
# provides testing capabilities for project
group.dev.dependencies.pytest = ">=8.2,<10.0"
# used by pandas for extracting metadata and platemap data from S3 through pandas
group.dev.dependencies.s3fs = ">=2024.9,<2027.0"
# used for rendering plots as images within example notebooks
group.dev.dependencies.selenium = "^4.24.0"
# used for test data generation
group.dev.dependencies.sqlalchemy = ">=1.3.6,<3"
# added for demonstrating results after using cosmicqc
group.dev.dependencies.umap-learn = "^0.5.6"
# used for gathering version data for docsite
group.docs.dependencies.dunamai = "^1.22.0"
# used for rendering notebooks through myst parser
group.docs.dependencies.myst-nb = "^1.1.1"
# used for rendering markdown through sphinx
group.docs.dependencies.myst-parser = ">=3,<5"
# used for rendering docs into docsite
group.docs.dependencies.sphinx = ">=7,<9"
# used for extension sphinx-multiversion and to fix git-based challenges with default branch handling
group.docs.dependencies.sphinx-multiversion = { git = "https://github.com/J-RN/sphinx-multiversion", rev = "a77f0c862dace3a62c18fc866da60ef7dde3873d" }
# used for theming the docsite
group.docs.dependencies.sphinx-wagtail-theme = "^6.3.0"
scripts.cosmicqc = "cosmicqc.cli:cli_analyze"
requires-plugins.poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = [ "plugin" ] }

[tool.poetry-dynamic-versioning]
enable = true
style = "pep440"
vcs = "git"
# specify where version replacement is performed
substitution.files = [ "src/cosmicqc/__init__.py" ]

# defines various development tasks
[tool.setuptools_scm]
root = "."

[tool.ruff]
target-version = "py310"
line-length = 88
fix = true
lint.select = [
  # flake8-builtins
  "A",
  # flake8-annotations
  "ANN",
  # flake8-comprehensions
  "C4",
  # mccabe
  "C90",
  # pycodestyle
  "E",
  # pyflakes
  "F",
  # isort
  "I",
  # pylint
  "PL",
  # ruff
  "RUF",
  # flake8-simplify
  "SIM",
  "W",
]
# Ignore `E402` and `F401` (unused imports) in all `__init__.py` files
lint.per-file-ignores."__init__.py" = [ "E402", "F401" ]
lint.per-file-ignores."docs/" = [ "E402", "F401" ]
# ignore long line and func def warnings with notebooks
lint.per-file-ignores."docs/src/examples/*.ipynb" = [ "E501", "E703", "F821", "PLR0913" ]
lint.per-file-ignores."docs/src/examples/*.py" = [ "E501", "E703", "PLR0913" ]
lint.per-file-ignores."tests/*" = [ "ANN201", "ANN202", "PLR0913", "PLR2004" ]

[tool.isort]
profile = "black"

[tool.vulture]
paths = [ "src/cosmicqc", "tests" ]
min_confidence = 90

# set dynamic versioning capabilities for project
[tool.bandit]
exclude_dirs = [ "tests" ]

[tool.pytest]
ini_options.markers = [
  "generate_report_image: tests which involve the creation of report images.",
]

[tool.coverage]
# settings to avoid errors with cv2 and coverage
# see here for more: https://github.com/nedbat/coveragepy/issues/1653
run.omit = [
  "config-3.py",
  "config.py",
]

[tool.jupytext]
formats = "ipynb,py:light"

[tool.poe]
# note: quarto commands below expect quarto installed on the local system.
# see here for more information: https://quarto.org/docs/download/
tasks.poster-preview.shell = """
quarto preview \
  docs/presentations/2024-09-18-SBI2-Conference/poster.qmd
"""
tasks.poster-render.shell = """
  quarto render \
  docs/presentations/2024-09-18-SBI2-Conference/poster.qmd
  mkdir -p docs/src/media
  mv docs/presentations/2024-09-18-SBI2-Conference/sbi2-2024-cosmicqc-poster.pdf \
  docs/src/media
"""

# Default threshold sets (z-scores) for finding poor quality nuclei and cell
# segmentations. Adapted from the PCCMA single-cell quality control defaults.
#
# NOTE: the intensity features assume the nuclear stain channel is named "DNA"
# (the Cell Painting / JUMP convention). If your channel has a different name
# (e.g. "Hoechst" or "DAPI"), pass your own feature_thresholds or
# feature_thresholds_file.
versions:
  cellprofiler: ">=4.2.4"
thresholds:
  # clustered nuclei (high mass displacement and high intensity)
  clustered_nuclei:
    # set very low to detect all instances of clustering nuclei
    Nuclei_Intensity_MassDisplacement_DNA: 0.1
    # set higher than mass displacement to avoid false positives
    Nuclei_Intensity_IntegratedIntensity_DNA: 1.5
  # very irregular shaped nuclei (low solidity), likely indicating mis-segmentation
  low_solidity_nuclei:
    Nuclei_AreaShape_Solidity: -2.0
  # cells that contain multiple nuclei (high DNA intensity in the cell)
  cells_multiple_nuclei:
    # set high to only remove the most extreme cells
    Cells_Intensity_IntegratedIntensity_DNA: 3.0

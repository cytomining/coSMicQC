name: dependabot jobs

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: write

# Serialize runs for the same PR so that this workflow's own push (which
# re-triggers it via the `synchronize` event) does not race with a later run
# updating the same branch ref, a common source of rejected pushes.
concurrency:
  group: dependabot-pre-commit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pre-commit:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      # checks out the repo
      - uses: actions/checkout@v7
        with:
          # fetch tags for versioning details
          fetch-depth: 0
          # Check out the branch that Dependabot’s PR is coming from
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: true
      - name: Fetch tags
        run: git fetch --all --tags
      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Setup for poetry
        run: |
          python -m pip install poetry
          poetry self add "poetry-dynamic-versioning[plugin]"
      - name: Install environment
        run: poetry install --no-interaction --no-ansi
      # run pre-commit
      - uses: pre-commit/action@v3.0.1
        id: pre_commit
        continue-on-error: true
      - name: Check for changes
        if: ${{ steps.pre_commit.outcome == 'failure' }}
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes_detected=true" >> "$GITHUB_ENV"
          else
            echo "changes_detected=false" >> "$GITHUB_ENV"
          fi
      - name: Commit and push changes
        if: ${{ env.changes_detected == 'true' &&
          steps.pre_commit.outcome == 'failure' }}
        # Pass the (potentially untrusted) branch name via the environment
        # rather than interpolating it directly into the script.
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: auto-apply pre-commit fixes"
          # Push with retries to tolerate transient GitHub-side failures
          # (e.g. "remote: fatal error in commit_refs") and to recover from a
          # branch that moved underneath us by rebasing before each retry.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); refreshing and retrying."
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}" || git rebase --abort
            sleep $((attempt * 5))
          done
          echo "Push failed after multiple attempts."
          exit 1
      # raise error if there were no changes and pre-commit failed
      - name: Errors detected
        if: ${{ env.changes_detected == 'false' &&
          steps.pre_commit.outcome == 'failure' }}
        run: |
          echo 'Pre-commit failed and was unable to make changes'
          exit 1

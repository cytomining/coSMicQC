---
# used for running tests
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre_commit_checks:
    # we avoid running duplicative
    # pre-commit checks for dependabot PRs
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      # checks out the repo
      - uses: actions/checkout@v7
        with:
          # fetch tags for versioning details
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --all --tags
      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Install environment
        run: uv sync
      # run pre-commit
      - uses: pre-commit/action@v3.0.1
        id: pre_commit
      # run pre-commit ci lite for automated fixes
      - uses: pre-commit-ci/lite-action@v1.1.0
        if: ${{ !cancelled() && steps.pre_commit.outcome == 'failure' }}
  run_tests:
    strategy:
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
        # fetch tags for versioning details
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --all --tags
      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Run pytest
        # run all tests except those marked generate_report_image.
        # uv installs only the default `dev` group here (not `docs`), so the
        # git-based sphinx-multiversion dependency -- whose anonymous fetch is
        # rate-limited to a 403 when the matrix installs it in parallel -- is
        # not pulled during tests.
        run: uv run --frozen pytest -m "not generate_report_image"

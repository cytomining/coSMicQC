[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core" ]

[tool.poetry]
name = "napari-env"
version = "0.1.0"
description = "Standalone Poetry environment for napari figures"
authors = [ "Way Science Community" ]
license = "BSD-3-Clause"
package-mode = false
dependencies.python = ">=3.9,<3.13"
# core scientific packages (numpy pinned <2.0 for napari compatibility)
dependencies.numpy = "<2.0"
dependencies.pandas = "^2.2"
dependencies.matplotlib = "^3.9"
dependencies.scikit-image = "^0.24"
dependencies.opencv-python = "^4.10"
dependencies.pyarrow = "^14.0"
# GUI / viewer stack
dependencies.PyQt5 = "^5.15"
dependencies.napari = { version = "^0.4.19", extras = [ "all" ] }
